<!--
  MachineForPigsVR: VR settings
  =============================
  Read when the game starts in VR (run\play_vr.bat). Edit with any text editor, then restart the game.
  This file lives next to aamfp.exe. Another file can be used with the environment variable HPL_VR_CONFIG.
  Environment variables (HPL_VR_SCALE, HPL_VR_MIRROR, ...) override the values here, if set.
  World scale is not a setting: 1 game unit = 1 metre, which looks right in the headset.
-->

<!--
  Render
    Scale        Render resolution per eye, relative to SteamVR's recommended size (which already includes the
                 "Render resolution" / supersampling you set in SteamVR). 1.0 = recommended. Lower = faster but
                 blurrier, higher = sharper but slower. Range 0.3 - 2.0.
    Projection   Asymmetric = render exactly the headset's (off-centre) field of view per eye (default, fastest).
                 Symmetric = older method: render a wider centred view and crop it (about 19% more pixels on
                 the Index). Only useful if Asymmetric ever shows a rendering glitch.
    EdgeSmooth   The game's edge smoothing (a screen-space blur on edges). Off by default in VR, because the
                 eye images are already supersampled and it makes the picture softer. true / false.
-->
<Render Scale="1.0" Projection="Asymmetric" EdgeSmooth="false" />

<!--
  Display
    RefreshRateHint   The refresh rate (Hz) you intend to play at, e.g. 90 or 120. 0 = no hint.
                      This only produces a note in hpl.log when SteamVR runs the headset at a different rate;
                      change the actual rate in SteamVR > Settings > Video (Index: 80/90/120/144 Hz).
-->
<Display RefreshRateHint="0" />

<!--
  Menu   Panel for menus, notes, inventory, hints and subtitles, placed in the world in front of you.
         Full-screen effects (fades, flashes) still cover your whole view.
    Distance      Distance from your eyes in metres.
    Width         Width of the panel in metres. The height follows the game's screen shape (about 1.09 x width
                  on the Index). Bigger = larger text. 2.0 m at 2.0 m covers about 53 degrees.
    Height        Height of the panel centre relative to your recentered eye height in metres (negative = lower).
    Follow        Lazy = during play the panel (hints, subtitles) moves in front of you again when you look more
                  than FollowAngle degrees away from it. Fixed = it stays where it is.
                  Either way, opening a menu, the journal or the inventory puts the panel in front of you,
                  and recentering (RecenterKey) does too.
    FollowAngle   See Follow (10 - 180 degrees).
    GazePointer   true = in menus, the cursor goes where the pointing controller's laser points (or, without
                  controllers or with Input Pointer="Head", where you look); click with the trigger or the mouse.
                  Moving the mouse takes over until the pointer moves again. false = mouse only.
    Keyboard      true = clicking a text field (e.g. the name of a new profile) opens the SteamVR keyboard; press its
                  Done key to confirm (same as Enter). false = type on the PC keyboard.
-->
<Menu Distance="2.0" Width="2.0" Height="0.0" Follow="Lazy" FollowAngle="40" GazePointer="true" Keyboard="true" />

<!--
  Reticle   The crosshair and the hand/interaction icons, shown at the spot you look at (in the world, at the
            distance of what you aim at), instead of on the menu panel.
    Size          1.0 = default size. Bigger = larger icons.
    MaxDistance   Furthest distance (metres) the reticle is placed at, e.g. when you look into the distance.
-->
<Reticle Size="1.0" MaxDistance="8" />

<!--
  Input
    RecenterKey   Key that makes your current head position and direction the new "straight ahead"
                  (seated). F1 - F12, or a single letter or digit. Works even when the desktop window
                  does not have focus. Clicking the right stick does the same.
    Hand          Which controller points and interacts: Right (default) or Left. The other hand holds the lantern.
                  (This alone does not swap the buttons; LeftHanded does.)
    LeftHanded    true = left-handed mode: the left controller points and interacts, the lantern goes in the right
                  hand and its hip spot moves to your right side, the right stick walks (click = run), the left
                  stick turns (click = recenter), and the A/B buttons swap hands (left B jump, left A crouch, right B
                  pause menu, right A journal). Hand defaults to Left then. The button swap is made for Index and
                  Quest controllers.
    Pointer       Hand = the pointing controller aims at things and menus (default). Head = you aim with your gaze,
                  as without controllers.
    StickDeadZone How far (0 - 0.8) the sticks must be pushed before they do anything.
    TriggerThreshold  How far (0.05 - 1) the right trigger must be pulled to interact / click. 0.5 = halfway,
                  1 = only the hard click at the end of the pull.

  Index controller buttons (defaults; remap in SteamVR > Settings > Controllers > Manage controller bindings):
    Left stick: walk (where you look), click = run on/off       Right stick: snap turn, up/down = scroll / move a held
                                                                             object closer/further, click = recenter
    Left A: journal          Left B: pause menu / back          Right trigger: interact (and click in menus)
    Left grip at your left hip: lantern out / away              Right grip: grab and hold an object (touch it with the
                                                                controller; throw by letting go mid-swing)
                                                                Right A: crouch   Right B: jump
-->
<Input RecenterKey="F9" LeftHanded="false" Pointer="Hand" StickDeadZone="0.15" TriggerThreshold="0.5" />

<!--
  Hands   (Index controllers)
    LanternInHand    true = the lantern hangs from your lantern hand (the hand that does not point). false = it
                     hangs where the flat game's arm would hold it.
    LanternUpright   true = the lantern hangs straight down and only turns with your hand. false = it tilts with
                     your hand.
    LanternTurn      What turns an upright lantern (twisting your hand never does, except in Hand mode):
                     Point = the way the controller points: aim it left/right with your wrist.
                     Arm   = it shines away from you through your hand: move the hand left/right to sweep the beam.
                     Fixed = it always faces the way your body faces (stick turning turns it with you).
                     Hand  = it turns with your hand.
    LanternArmPivot  Arm mode: how far behind your head (metres) the beam is aimed from. Larger = calmer beam
                     (moving the hand sweeps it less), smaller = more sweep.
    LanternOffset    Where the lantern's handle sits relative to the controller, in metres: right, up, back
                     (e.g. "0 -0.05 0" lowers it 5 cm).
    LanternYaw       Turns the lantern around its vertical axis, in degrees, counterclockwise seen from above
                     (negative = clockwise). 90 = default.
    Haptics          true = a light tick in the pointing hand when it comes onto something you can use.
    OffHandInteract  true = your other hand (left) can grab, open doors, pull levers etc. too: press its grip or
                     trigger. false = only the pointing hand does.
    LanternHandInteract  true = the lantern hand can do that while it holds the lantern too (default).
                     false = only with the lantern put away. (Needs OffHandInteract="true".)
    BothHandsHold    true = an object you hold stays in that hand while your other hand grabs something else or
                     opens a door etc. (Needs OffHandInteract="true".) false = one hand at a time.
    GrabSmallProps   true = small decorations that are fixed in the flat game (glasses, books, bottles, toys, papers,
                     tools...) can be picked up. They stay where they are until you grab them. Applies when a map
                     loads (load a save or change level after changing it). false = as in the flat game.
    GrabSmallPropsMaxSize  Largest size (metres, longest side) that counts as small. 0.5 = default.
    GrabSmallPropsExclude  Words (space separated): decorations whose entity file name contains one of them stay
                     fixed. Default "invisible mount sign wall hook pulley frame chain" (wall-mounted things and
                     invisible blockers).
    ShowHands        true = you see hands where your controllers are; the fingers follow your real fingers
                     (Index finger tracking) and close around the lantern.
    HandOffset       Where the right hand's wrist sits relative to the controller tip, in metres: right, up, back
                     (the left hand is mirrored). Tune this if the hands look shifted.
    HandRotation     Turn of the right hand in degrees around x (tilt up), y (turn left), z (roll); mirrored for
                     the left hand.
    FingerCurl       Degrees each finger joint bends when the finger is fully closed.
    ShowControllers  true = your controllers are shown in the game where your real ones are (SteamVR's own models).
    InteractReach    How close (metres) the tip of the controller must be to a door, lever, wheel or drawer to use it.
    GrabReach        How close (metres) the tip of the controller must be to an object to pick it up with the grip
                     (no "telekinesis"). 0.15 = touching it.
    LanternHip       true = reach to your hip with the lantern hand and press its grip to take the lantern out or
                     put it away (you feel a tick when the hand is at the hip).
    LanternHipOffset Where the hip is, relative to your head in metres: sideways (towards the lantern hand), up, back.
    LanternHipRadius How close (metres) the hand must be to that spot.
    ThrowStrength    Letting go of a held object while your hand moves throws it with your hand's speed times this
                     (0 = never throw, just drop).
    ThrowMaxSpeed    Fastest throw, metres per second.
    InteractStrength How strongly your hand's movement moves doors, levers, wheels and drawers (hold the trigger on
                     them and move your hand). Higher = less hand movement needed.
-->
<Hands LanternInHand="true" LanternUpright="true" LanternTurn="Point" LanternArmPivot="0.5" LanternOffset="0 0 0" LanternYaw="90" Haptics="true" OffHandInteract="true" LanternHandInteract="true" BothHandsHold="true" GrabSmallProps="true" GrabSmallPropsMaxSize="0.5" GrabSmallPropsExclude="invisible mount sign wall hook pulley frame chain" ShowHands="true" HandOffset="0.03 -0.04 0.14" HandRotation="0 0 0" FingerCurl="85" ShowControllers="false" InteractReach="0.2" GrabReach="0.15" LanternHip="true" LanternHipOffset="0.2 -0.7 0.15" LanternHipRadius="0.25" ThrowStrength="1.0" ThrowMaxSpeed="10" InteractStrength="1.0" />

<!--
  Mirror   The window on your desktop that shows what the left eye sees.
    Enabled   true / false. When false the window stays black (saves a little GPU time).
    Width, Height   Size of the window in pixels.
-->
<Mirror Enabled="true" Width="1280" Height="720" />

<!--
  Locomotion   (you walk with the keyboard/gamepad in the direction your head faces)
    StickTurn    How the right stick (Index controller or gamepad) turns you: Snap (instant turn per push, most comfortable),
                 Smooth (continuous, uses the game's look sensitivity) or Off.
    MouseTurn    Same for the mouse: Smooth (default), Snap or Off. Moving the mouse up/down never tilts the view;
                 it still works for levers, wheels and the like.
    SnapAngle    Degrees per snap turn (5 - 180).
    StraightAngle  When the walk stick is pushed within this many degrees of straight ahead, back or sideways, you
                 walk exactly straight (thumbs are never exact). 0 = off, up to 44. How far you push sets the speed.
    RoomScale    true = when you physically step or lean, your character moves with you (walls stop the body,
                 your head can still lean on). false = the character stays put, your head moves around it.
-->
<Locomotion StickTurn="Snap" MouseTurn="Smooth" SnapAngle="30" StraightAngle="20" RoomScale="true" />

<!--
  Body   Your height: recentering (RecenterKey) makes your current head height the game's eye height, so recenter
         after sitting down or standing up.
    RealCrouch    true = crouching in real life crouches in the game (and standing up stands up).
    CollisionWidth  Width (metres) of your body for collisions in VR. The flat game uses 0.8, which is in the way
                  of your hands (boxes and doors close to you get stuck on it). 0.2 - 0.8.
    EnemyHitWidth  Width (metres) of your body when an enemy attack checks whether it hit you. Separate from
                  CollisionWidth, so enemies hit as often as in the flat game (0.8) while your body stays thin. 0.2 - 1.5.
    EnemyAimAssist  Degrees: an enemy's swing is aimed at you when you're within this angle of where it faces
                  (you can step around it during the swing in VR). 0 = off, 0 - 180.
    OutOfMapKill  true = you die (and restart at the last checkpoint) when you end up outside the map, e.g. pushed
                  through a wall: more than 2 m below or 1 m beside the level's geometry.
    RealCrouchKeepsHeight  true = a real crouch only puts you in crouch mode (quieter, harder for enemies to
                  see); your view stays at your real head height. false = the view also drops to the game's crouch
                  height. The crouch button always lowers the view (the game's normal crouch).
    CrouchDepth   How far (metres) your head must go below the recentered height to crouch.
    MaxHeadRise   How far (metres) your view may rise above the recentered height (keeps your head out of ceilings).
    ShowArm       The flat game's arm holding the lantern. false = only the lantern is shown (until the controllers
                  are supported, it still hangs where the arm would hold it).
-->
<Body CollisionWidth="0.3" EnemyHitWidth="0.8" EnemyAimAssist="90" OutOfMapKill="true" RealCrouch="true" RealCrouchKeepsHeight="true" CrouchDepth="0.35" MaxHeadRise="0.15" ShowArm="false" />

<!--
  Comfort   Game effects that move or smear the whole view. true = as in the flat game.
    HeadBob       Up/down bobbing of the view while walking.
    ScreenShake   Strength of screen shakes (0 = none, 1 = as in the flat game).
    HeadSpin      The view spins when you get hit.
    LookAt        When the story makes you look at something: Snap (turn instantly towards it), Smooth (turn
                  slowly, like the flat game) or Off (nothing turns; the story waits until you look yourself).
    RadialBlur    Blur around the edges of the view (e.g. when running or hurt).
    ImageTrail    Motion trails behind moving images (also mixes the two eyes, so it looks wrong in VR).
-->
<Comfort HeadBob="false" ScreenShake="0.3" HeadSpin="false" LookAt="Snap" RadialBlur="false" ImageTrail="false" />
