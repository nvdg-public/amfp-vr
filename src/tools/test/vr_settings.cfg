<!--
  MachineForPigsVR: VR settings
  =============================
  Read when the game starts in VR (run\play_vr.bat). Edit with any text editor, then restart the game.
  This file lives next to aamfp.exe. Another file can be used with the environment variable HPL_VR_CONFIG.
  Environment variables (HPL_VR_SCALE, HPL_VR_MIRROR, ...) override the values here, if set.
  World scale is not a setting: 1 game unit = 1 metre, which looks right in the headset.
-->

<!--
  Render
    Scale        Render resolution per eye, relative to SteamVR's recommended size (which already includes the
                 "Render resolution" / supersampling you set in SteamVR). 1.0 = recommended. Lower = faster but
                 blurrier, higher = sharper but slower. Range 0.3 - 2.0.
    Projection   Asymmetric = render exactly the headset's (off-centre) field of view per eye (default, fastest).
                 Symmetric = older method: render a wider centred view and crop it (about 19% more pixels on
                 the Index). Only useful if Asymmetric ever shows a rendering glitch.
    EdgeSmooth   The game's edge smoothing (a screen-space blur on edges). Off by default in VR, because the
                 eye images are already supersampled and it makes the picture softer. true / false.
-->
<Render Scale="1.0" Projection="Asymmetric" EdgeSmooth="false" />

<!--
  Display
    RefreshRateHint   The refresh rate (Hz) you intend to play at, e.g. 90 or 120. 0 = no hint.
                      This only produces a note in hpl.log when SteamVR runs the headset at a different rate;
                      change the actual rate in SteamVR > Settings > Video (Index: 80/90/120/144 Hz).
-->
<Display RefreshRateHint="0" />

<!--
  Menu   Panel for menus, notes, inventory, hints and the crosshair, placed in the world in front of you
         (it stays where it is when you turn your head; recentering moves it to straight ahead again).
         Full-screen effects (fades, flashes) still cover your whole view.
    Distance   Distance from your eyes in metres (as of the last recenter).
    Width      Width of the panel in metres. The height follows the game's screen shape (about 1.09 x width
               on the Index). Bigger = larger text. 2.0 m at 2.0 m covers about 53 degrees.
    Height     Height of the panel centre relative to your eyes in metres (negative = lower).
-->
<Menu Distance="2.0" Width="2.0" Height="0.0" />

<!--
  Input
    RecenterKey   Key that makes your current head position and direction the new "straight ahead"
                  (seated). F1 - F12, or a single letter or digit. Works even when the desktop window
                  does not have focus.
-->
<Input RecenterKey="F9" />

<!--
  Mirror   The window on your desktop that shows what the left eye sees.
    Enabled   true / false. When false the window stays black (saves a little GPU time).
    Width, Height   Size of the window in pixels.
-->
<Mirror Enabled="true" Width="1280" Height="720" />
